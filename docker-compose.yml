version: '3.8'

services:
  backend:
    image: ghcr.io/${DOCKER_IMAGE_OWNER:-pakeins}/ecencia-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecencia-backend
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    volumes:
      - ./convenios:/usr/src/convenios



  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: ecencia-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${AZURE_DOMAIN:-ecenciaapp.eastus2.cloudapp.azure.com}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - WEBHOOK_URL=https://${AZURE_DOMAIN:-ecenciaapp.eastus2.cloudapp.azure.com}/n8n/
      - N8N_PATH=/n8n/
      - NODE_FUNCTION_ALLOW_BUILTIN=fs
      - NODE_FUNCTION_ALLOW_ENV=*
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/n8n/.n8n:/home/node/.n8n
      - ./backend/n8n/code:/scripts
      - ./backend/n8n/workflows:/workflows


