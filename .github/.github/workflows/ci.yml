name: CI/CD DevSecOps

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'eciencia-andina-preprod' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'eciencia' }}
  N8N_IMAGE: docker.io/n8nio/n8n:2.26.5
  NODE_VERSION: "22"
  TERRAFORM_VERSION: "1.14.6"
  TF_LOCK_TIMEOUT: "10m"

jobs:
  quality:
    name: Quality, Audit, Coverage, Build
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend install
        working-directory: backend
        run: npm ci

      - name: Backend audit
        working-directory: backend
        run: npm audit --audit-level=moderate

      - name: Backend lint
        working-directory: backend
        run: npm run lint

      - name: Backend tests with coverage
        working-directory: backend
        run: npm run test:coverage

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend audit
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Docker build smoke
        run: |
          docker build -t eciencia-backend-smoke ./backend
          docker build -t eciencia-frontend-smoke ./frontend

      - name: Require Sonar token on trusted refs
        if: ${{ env.SONAR_TOKEN == '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          echo "SONAR_TOKEN is required for trusted PRs and main."
          exit 1

      - name: SonarQube Cloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.2.0
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: |
            backend/coverage
            frontend/coverage

  zap:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start ephemeral stack
        run: docker compose -f docker-compose.zap.yml up -d --build

      - name: Wait for HTTP targets
        run: node scripts/wait-http.js http://127.0.0.1:8080 http://127.0.0.1:3001/

      - name: ZAP frontend baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:8080
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap_frontend
          cmd_options: "-x report_xml.xml -I"

      - name: Preserve ZAP frontend reports
        if: always()
        run: |
          cp report_json.json zap-frontend.json || true
          cp report_html.html zap-frontend.html || true
          cp report_md.md zap-frontend.md || true
          cp report_xml.xml zap-frontend.xml || true

      - name: ZAP backend baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:3001
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap_backend
          cmd_options: "-x report_xml.xml -I"

      - name: Preserve ZAP backend reports
        if: always()
        run: |
          cp report_json.json zap-backend.json || true
          cp report_html.html zap-backend.html || true
          cp report_md.md zap-backend.md || true
          cp report_xml.xml zap-backend.xml || true

      - name: Fail on High alerts
        run: node scripts/zap-fail-on-high.js zap-frontend.json zap-backend.json

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zap-reports
          path: |
            zap-*.html
            zap-*.md
            zap-*.xml
            zap-*.json

      - name: Stop ephemeral stack
        if: always()
        run: docker compose -f docker-compose.zap.yml down --volumes --remove-orphans

  terraform:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest
    needs: quality
    env:
      GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform format
        run: terraform fmt -check -recursive infra

      - name: Terraform init bootstrap without backend
        run: terraform -chdir=infra/bootstrap init -backend=false -input=false

      - name: Terraform validate bootstrap
        run: terraform -chdir=infra/bootstrap validate -no-color

      - name: Terraform init preprod without backend
        run: terraform -chdir=infra/preprod init -backend=false -input=false

      - name: Terraform validate preprod
        run: terraform -chdir=infra/preprod validate -no-color

      - name: Require GCP variables for trusted plan
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          missing=0
          for name in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOYER_SERVICE_ACCOUNT SUPABASE_URL SUPABASE_PROJECT_ID TELEGRAM_BOT_USERNAME; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub variable::$name is required in Settings > Secrets and variables > Actions > Variables"
              missing=1
            fi
          done
          exit "$missing"

      - name: Authenticate to Google Cloud
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Terraform init preprod remote backend
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: terraform -chdir=infra/preprod init -reconfigure -input=false

      - name: Terraform plan preprod
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          BACKEND_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/backend:${GITHUB_SHA}"
          FRONTEND_IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/frontend:${GITHUB_SHA}"
          terraform -chdir=infra/preprod plan -input=false -no-color -lock-timeout="${TF_LOCK_TIMEOUT}" \
            -var="project_id=${GCP_PROJECT_ID}" \
            -var="region=${GCP_REGION}" \
            -var="gar_repository=${GAR_REPOSITORY}" \
            -var="backend_image=${BACKEND_IMAGE}" \
            -var="frontend_image=${FRONTEND_IMAGE}" \
            -var="n8n_image=${N8N_IMAGE}" \
            -var="supabase_url=${SUPABASE_URL}" \
            -var="supabase_project_id=${SUPABASE_PROJECT_ID}" \
            -var="telegram_bot_username=${TELEGRAM_BOT_USERNAME}"

  migrate:
    name: Apply DB migrations to preprod
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        if: ${{ env.SUPABASE_DB_URL != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations (supabase db push)
        if: ${{ env.SUPABASE_DB_URL != '' }}
        working-directory: backend
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Skip notice (no DB secret configured)
        if: ${{ env.SUPABASE_DB_URL == '' }}
        run: echo "::warning::SUPABASE_DB_URL no configurado; se omite la aplicacion de migraciones. Agregalo en Settings > Secrets and variables > Actions para habilitarlo (formato postgresql://postgres:PASSWORD@db.lkffhdcavohaxdihvwlb.supabase.co:5432/postgres)."

  deploy:
    name: Build, Push and Deploy Preprod
    runs-on: ubuntu-latest
    needs: [quality, zap, terraform, migrate]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    env:
      GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require deploy variables
        run: |
          missing=0
          for name in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOYER_SERVICE_ACCOUNT SUPABASE_URL SUPABASE_PROJECT_ID TELEGRAM_BOT_USERNAME; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub variable::$name is required in Settings > Secrets and variables > Actions > Variables"
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Compute image tags
        run: |
          echo "BACKEND_IMAGE=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/backend:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/frontend:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Terraform init preprod
        run: terraform -chdir=infra/preprod init -input=false

      - name: Import existing preprod resources into Terraform state
        run: bash scripts/terraform-import-preprod-existing.sh

      - name: Build and push backend image
        run: |
          docker build -t "$BACKEND_IMAGE" ./backend
          docker push "$BACKEND_IMAGE"

      - name: Build and push frontend image
        run: |
          docker build -t "$FRONTEND_IMAGE" ./frontend
          docker push "$FRONTEND_IMAGE"

      - name: Terraform apply preprod first pass
        run: |
          terraform -chdir=infra/preprod apply -auto-approve -input=false -lock-timeout="${TF_LOCK_TIMEOUT}" \
            -var="project_id=${GCP_PROJECT_ID}" \
            -var="region=${GCP_REGION}" \
            -var="gar_repository=${GAR_REPOSITORY}" \
            -var="backend_image=${BACKEND_IMAGE}" \
            -var="frontend_image=${FRONTEND_IMAGE}" \
            -var="n8n_image=${N8N_IMAGE}" \
            -var="supabase_url=${SUPABASE_URL}" \
            -var="supabase_project_id=${SUPABASE_PROJECT_ID}" \
            -var="telegram_bot_username=${TELEGRAM_BOT_USERNAME}"

      - name: Capture Cloud Run URLs
        run: |
          echo "BACKEND_URL=$(terraform -chdir=infra/preprod output -raw backend_url)" >> "$GITHUB_ENV"
          echo "FRONTEND_URL=$(terraform -chdir=infra/preprod output -raw frontend_url)" >> "$GITHUB_ENV"
          echo "N8N_URL=$(terraform -chdir=infra/preprod output -raw n8n_url)" >> "$GITHUB_ENV"

      - name: Terraform apply preprod with public URLs
        run: |
          terraform -chdir=infra/preprod apply -auto-approve -input=false -lock-timeout="${TF_LOCK_TIMEOUT}" \
            -var="project_id=${GCP_PROJECT_ID}" \
            -var="region=${GCP_REGION}" \
            -var="gar_repository=${GAR_REPOSITORY}" \
            -var="backend_image=${BACKEND_IMAGE}" \
            -var="frontend_image=${FRONTEND_IMAGE}" \
            -var="n8n_image=${N8N_IMAGE}" \
            -var="supabase_url=${SUPABASE_URL}" \
            -var="supabase_project_id=${SUPABASE_PROJECT_ID}" \
            -var="telegram_bot_username=${TELEGRAM_BOT_USERNAME}" \
            -var="public_backend_url=${BACKEND_URL}" \
            -var="public_frontend_url=${FRONTEND_URL}" \
            -var="public_n8n_url=${N8N_URL}"

      - name: Register Telegram webhook
        working-directory: backend
        run: |
          TELEGRAM_BOT_TOKEN="$(gcloud secrets versions access latest --secret=eciencia-telegram-bot-token --project="${GCP_PROJECT_ID}")"
          TELEGRAM_WEBHOOK_SECRET="$(gcloud secrets versions access latest --secret=eciencia-telegram-webhook-secret --project="${GCP_PROJECT_ID}")"
          echo "::add-mask::$TELEGRAM_BOT_TOKEN"
          echo "::add-mask::$TELEGRAM_WEBHOOK_SECRET"
          TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
          TELEGRAM_WEBHOOK_SECRET="$TELEGRAM_WEBHOOK_SECRET" \
          TELEGRAM_WEBHOOK_URL="${BACKEND_URL}/api/telegram/webhook" \
          npm run telegram:set-webhook

      - name: Smoke check deployed services
        run: |
          curl -fsS "$FRONTEND_URL" >/dev/null
          curl -fsS "$BACKEND_URL/api/check-db" >/dev/null
