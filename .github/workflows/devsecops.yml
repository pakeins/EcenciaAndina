name: CI/CD DevSecOps

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Quality, Audit, Coverage, Build
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: "https://example.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-key"
      SUPABASE_ANON_KEY: "dummy-key"
      JWT_SECRET: "dummy-secret"
      PORT: 3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend install
        working-directory: backend
        run: npm ci

      - name: Backend audit
        working-directory: backend
        run: npm audit --audit-level=critical

      - name: Backend lint
        working-directory: backend
        run: npm run lint

      - name: Backend tests with coverage
        working-directory: backend
        run: npm run test:coverage

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend audit
        working-directory: frontend
        run: npm audit --audit-level=critical

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            backend/coverage
            frontend/coverage

      - name: Upload frontend build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  zap:
    name: OWASP ZAP Baseline Security
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start ephemeral stack
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: docker compose -f docker-compose.zap.yml up -d --build

      - name: Wait for HTTP targets
        env:
          WAIT_HTTP_TIMEOUT_MS: 300000
        run: |
          npm init -y
          npm install axios
          node scripts/wait-http.js http://127.0.0.1:8080 http://127.0.0.1:3001/

      - name: ZAP frontend baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://127.0.0.1:8080
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap_frontend
          cmd_options: "-x report_xml.xml -I"

      - name: Preserve ZAP frontend reports
        if: always()
        run: |
          cp report_json.json zap-frontend.json || true
          cp report_html.html zap-frontend.html || true
          cp report_md.md zap-frontend.md || true
          cp report_xml.xml zap-frontend.xml || true

      - name: ZAP backend baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://127.0.0.1:3001
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap_backend
          cmd_options: "-x report_xml.xml -I"

      - name: Preserve ZAP backend reports
        if: always()
        run: |
          cp report_json.json zap-backend.json || true
          cp report_html.html zap-backend.html || true
          cp report_md.md zap-backend.md || true
          cp report_xml.xml zap-backend.xml || true

      - name: Fail on High alerts
        run: node scripts/zap-fail-on-high.js zap-frontend.json zap-backend.json

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            zap-*.html
            zap-*.md
            zap-*.xml
            zap-*.json

      - name: Stop ephemeral stack
        if: always()
        run: docker compose -f docker-compose.zap.yml down --volumes --remove-orphans

  deploy:
    name: Continuous Deployment (Azure VM)
    runs-on: ubuntu-latest
    needs: [quality, zap]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Copy Frontend to Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          source: "frontend-dist/*"
          target: "/var/www/html/"
          strip_components: 1

      - name: Update Backend & n8n on Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            cd /home/${{ secrets.AZURE_USER }}/ECenciaAPP
            git pull origin main
            docker compose build
            docker compose up -d
            docker system prune -f
