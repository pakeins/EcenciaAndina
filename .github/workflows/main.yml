name: CI/CD DevSecOps

# ==============================================================================
# ⚠️ FLUJO GRANULAR Y MODULARIZADO ⚠️
# Pipeline hiper-segmentado para visualización completa de todas las etapas
# de pruebas, calidad y seguridad en la pestaña "Actions".
# ==============================================================================

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  security-secrets:
    name: Security Scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  lint-backend:
    name: Code Quality (Backend) - ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install & Lint Backend
        working-directory: backend
        run: |
          npm ci
          npm run lint

  lint-frontend:
    name: Code Quality (Frontend) - ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Lint Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint

  security-npm:
    name: Security Audit - NPM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: NPM Audit Backend
        working-directory: backend
        continue-on-error: true
        run: npm audit --audit-level=critical || true
      - name: NPM Audit Frontend
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=critical || true

  security-trivy:
    name: Security Scan - Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  test-backend:
    name: Unit Tests (Backend) - Vitest
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: "https://example.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-key"
      SUPABASE_ANON_KEY: "dummy-key"
      JWT_SECRET: "dummy-secret"
      PORT: 3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install & Test Backend
        working-directory: backend
        run: |
          npm ci
          set -o pipefail
          CI=true NO_COLOR=1 npm run test:coverage 2>&1 | tee test_output_raw.txt
          sed -r "s/\x1B\[([0-9]{1,3}(;[0-9]{1,2};?)?)?[mGK]//g" test_output_raw.txt > test_output.txt
      - name: Backend coverage summary
        if: always()
        working-directory: backend
        run: |
          echo "### 🧪 Backend Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat test_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage
          if-no-files-found: warn

  test-frontend:
    name: Unit Tests (Frontend) - Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Test Frontend
        working-directory: frontend
        run: |
          npm ci
          set -o pipefail
          CI=true NO_COLOR=1 npm run test:coverage 2>&1 | tee test_output_raw.txt
          sed -r "s/\x1B\[([0-9]{1,3}(;[0-9]{1,2};?)?)?[mGK]//g" test_output_raw.txt > test_output.txt
      - name: Frontend coverage summary
        if: always()
        working-directory: frontend
        run: |
          echo "### 🧪 Frontend Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat test_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage
          if-no-files-found: warn

  sonarcloud:
    name: Code Analysis - SonarCloud
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Backend Coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-backend
          path: backend/coverage
      - name: Download Frontend Coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-frontend
          path: frontend/coverage
      - name: SonarQube Cloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@master
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_REF: refs/heads/master

  integration-tests:
    name: Integration Tests - Supertest
    runs-on: ubuntu-latest
    needs: [test-backend]
    env:
      SUPABASE_URL: "https://example.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-key"
      SUPABASE_ANON_KEY: "dummy-key"
      JWT_SECRET: "dummy-secret"
      PORT: 3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run Integration Tests
        working-directory: backend
        run: npm run test:integration

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Upload frontend build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  zap:
    name: OWASP ZAP Baseline Security
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Start ephemeral stack
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_INVITE_TOKEN_SECRET: ${{ secrets.TELEGRAM_INVITE_TOKEN_SECRET }}
        run: docker compose -f docker-compose.zap.yml up -d --build
      - name: Wait for HTTP targets
        env:
          WAIT_HTTP_TIMEOUT_MS: 600000
        run: |
          npm init -y
          npm install axios
          node scripts/wait-http.js http://127.0.0.1:8080 http://127.0.0.1:3001/
      - name: ZAP frontend baseline
        uses: zaproxy/action-baseline@v0.15.0
        if: always()
        continue-on-error: true
        with:
          target: http://127.0.0.1:8080
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap_frontend
      - name: Preserve ZAP frontend reports
        if: always()
        run: |
          cp report_json.json zap-frontend.json || true
          cp report_html.html zap-frontend.html || true
          cp report_md.md zap-frontend.md || true
      - name: ZAP backend baseline
        uses: zaproxy/action-baseline@v0.15.0
        if: always()
        continue-on-error: true
        with:
          target: http://127.0.0.1:3001
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap_backend
      - name: Preserve ZAP backend reports
        if: always()
        run: |
          cp report_json.json zap-backend.json || true
          cp report_html.html zap-backend.html || true
          cp report_md.md zap-backend.md || true
      - name: Fail on High alerts
        run: node scripts/zap-fail-on-high.js zap-frontend.json zap-backend.json
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            zap-*.html
            zap-*.md
            zap-*.xml
            zap-*.json
      - name: Stop ephemeral stack
        if: always()
        run: docker compose -f docker-compose.zap.yml down --volumes --remove-orphans

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test-backend, test-frontend, sonarcloud, integration-tests, security-trivy, security-npm, security-secrets, build, zap]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  migrate:
    name: Apply DB Migrations
    runs-on: ubuntu-latest
    needs: [lint-backend, test-backend]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        if: ${{ env.SUPABASE_DB_URL != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply migrations
        if: ${{ env.SUPABASE_DB_URL != '' }}
        working-directory: backend
        run: supabase db push --db-url "$SUPABASE_DB_URL"
      - name: Skip notice
        if: ${{ env.SUPABASE_DB_URL == '' }}
        run: echo "::warning::SUPABASE_DB_URL no configurado; se omite la aplicacion de migraciones."

  deploy:
    name: Continuous Deployment (Azure VM)
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test-backend, test-frontend, sonarcloud, integration-tests, security-trivy, security-npm, security-secrets, build, zap, release, migrate]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist
      - name: Copy Frontend to Azure VM (Apache)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          source: "frontend-dist/*"
          target: "/var/www/html/"
          strip_components: 1
      - name: Deploy Backend & Bot on Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            if [ ! -d "/home/${{ secrets.AZURE_USER }}/EcenciaAPP" ]; then
              echo "Cloning EcenciaAPP for the first time..."
              git clone https://${{ secrets.GH_PAT }}@github.com/Packeins/EcenciaAndinaAPP.git /home/${{ secrets.AZURE_USER }}/EcenciaAPP
            fi
            
            cd /home/${{ secrets.AZURE_USER }}/EcenciaAPP
            # Actualizar URL remota con token para repos privados
            git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/Packeins/EcenciaAndinaAPP.git
            git fetch --all
            git reset --hard origin/main
            
            if [ -f "/home/${{ secrets.AZURE_USER }}/ECenciaAPP/backend/.env" ]; then
              cp /home/${{ secrets.AZURE_USER }}/ECenciaAPP/backend/.env backend/.env
            else
              touch backend/.env
            fi
            
            set_env() {
              local key=$1
              local val=$2
              if grep -q "^${key}=" backend/.env; then
                local escaped_val=$(echo "$val" | sed 's/\//\\\//g')
                sed -i "s|^${key}=.*|${key}=${escaped_val}|" backend/.env
              else
                echo "${key}=${val}" >> backend/.env
              fi
            }
            
            set_env "SUPABASE_URL" "${{ secrets.SUPABASE_URL }}"
            set_env "SUPABASE_ANON_KEY" "${{ secrets.SUPABASE_ANON_KEY }}"
            set_env "SUPABASE_SERVICE_ROLE_KEY" "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            set_env "TELEGRAM_BOT_TOKEN" "${{ secrets.TELEGRAM_BOT_TOKEN }}"
            set_env "TELEGRAM_WEBHOOK_SECRET" "${{ secrets.TELEGRAM_WEBHOOK_SECRET }}"
            set_env "TELEGRAM_INVITE_TOKEN_SECRET" "${{ secrets.TELEGRAM_INVITE_TOKEN_SECRET }}"
            set_env "GMAIL_USER" "${{ secrets.GMAIL_USER }}"
            set_env "GMAIL_APP_PASSWORD" "${{ secrets.GMAIL_APP_PASSWORD }}"
            
            docker compose build
            docker compose up -d
            docker image prune -af
            
            echo "Esperando 15 segundos para que los servicios inicialicen..."
            sleep 15
            
            # Smoke Test Post-Despliegue
            if curl -fsS --max-time 10 http://localhost:3001/api/check-db > /dev/null 2>&1; then
              echo "✅ Smoke Test Backend: EXITOSO (API respondiendo y BD conectada)"
            else
              echo "::error::❌ Smoke Test Backend: FALLO (El servidor no responde o la BD esta caida)"
              exit 1
            fi
