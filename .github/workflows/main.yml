name: CI/CD DevSecOps

# ==============================================================================
# ⚠️ MODO AHORRO DE MINUTOS ⚠️
# Pipeline reducido TEMPORALMENTE para ahorrar minutos de GitHub Actions.
# Solo ejecuta: Build Frontend → Docker Image → Deploy a Azure VM → Deploy Bot
#
# Para restaurar el pipeline completo, revertir este archivo al commit anterior:
#   git checkout 8762715 -- .github/workflows/main.yml
# ==============================================================================

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ecencia-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-bot-azure:
    name: Deploy Bot to Azure Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        working-directory: telegram-bot-function
        run: npm ci --production
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        continue-on-error: true
      - name: Remove conflicting app setting
        run: |
          az functionapp config appsettings delete \
            --name ${{ secrets.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group RG-TERRAFORM-PROCESS \
            --setting-names WEBSITE_RUN_FROM_PACKAGE 2>/dev/null || echo "Setting not found or login skipped, continuing..."
        continue-on-error: true
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: ./telegram-bot-function
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: false

  deploy:
    name: Continuous Deployment (Azure VM)
    runs-on: ubuntu-latest
    needs: [build, docker-build, deploy-bot-azure]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist
      - name: Copy Frontend to Azure VM (Apache)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          source: "frontend-dist/*"
          target: "/var/www/html/"
          strip_components: 1
      - name: Deploy Backend & Bot on Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            if [ ! -d "/home/${{ secrets.AZURE_USER }}/EcenciaAPP" ]; then
              echo "Cloning EcenciaAPP for the first time..."
              git clone https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git /home/${{ secrets.AZURE_USER }}/EcenciaAPP
            fi
            
            cd /home/${{ secrets.AZURE_USER }}/EcenciaAPP
            # Actualizar URL remota con token para repos privados
            git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git
            git fetch --all
            git reset --hard origin/main
            
            if [ -f "/home/${{ secrets.AZURE_USER }}/ECenciaAPP/backend/.env" ]; then
              cp /home/${{ secrets.AZURE_USER }}/ECenciaAPP/backend/.env backend/.env
            else
              touch backend/.env
            fi
            
            set_env() {
              local key=$1
              local val=$2
              if grep -q "^${key}=" backend/.env; then
                local escaped_val=$(echo "$val" | sed 's/\//\\\//g')
                sed -i "s|^${key}=.*|${key}=${escaped_val}|" backend/.env
              else
                echo "${key}=${val}" >> backend/.env
              fi
            }
            
            set_env "SUPABASE_URL" "${{ secrets.SUPABASE_URL }}"
            set_env "SUPABASE_ANON_KEY" "${{ secrets.SUPABASE_ANON_KEY }}"
            set_env "SUPABASE_SERVICE_ROLE_KEY" "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            set_env "TELEGRAM_BOT_TOKEN" "${{ secrets.TELEGRAM_BOT_TOKEN }}"
            set_env "TELEGRAM_WEBHOOK_SECRET" "${{ secrets.TELEGRAM_WEBHOOK_SECRET || 'EcenciaWebhookSecret2026' }}"
            set_env "TELEGRAM_INVITE_TOKEN_SECRET" "${{ secrets.TELEGRAM_INVITE_TOKEN_SECRET || 'EcenciaInviteToken2026' }}"
            set_env "GMAIL_USER" "${{ secrets.GMAIL_USER || 'ecencia.andina.notificaciones@gmail.com' }}"
            set_env "GMAIL_APP_PASSWORD" "${{ secrets.GMAIL_APP_PASSWORD || 'dummy-password' }}"
            set_env "INTERNAL_API_SECRET" "${{ secrets.INTERNAL_API_SECRET || 'dev-internal-secret-123' }}"
            set_env "TELEGRAM_MICROSERVICE_URL" "https://${{ secrets.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api"
            set_env "N8N_MENU_WEBHOOK_URL" "${{ secrets.N8N_MENU_WEBHOOK_URL || 'http://n8n:5678/webhook/ECENCIA-enviar-menu-manual' }}"
            set_env "N8N_MENU_WEBHOOK_SECRET" "${{ secrets.N8N_MENU_WEBHOOK_SECRET || 'change-this-local-menu-webhook-secret' }}"
            
            # Exportar variables necesarias para docker-compose
            export GITHUB_REPOSITORY=${{ github.repository }}
            export DOCKER_IMAGE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            
            # Autenticarse en GHCR para descargar la imagen
            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Descargar la imagen preconstruida y levantar los servicios
            docker compose pull
            docker compose up -d
            docker image prune -af
            
            # Restaurar Webhook
            echo "Registrando webhook de Telegram apuntando a Azure Functions..."
            export TELEGRAM_WEBHOOK_URL="https://${{ secrets.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net/api/telegram/webhook"
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook" \
              -d "url=${TELEGRAM_WEBHOOK_URL}" \
              -d "secret_token=${{ secrets.TELEGRAM_WEBHOOK_SECRET || 'EcenciaWebhookSecret2026' }}" > /dev/null 2>&1 || echo "::warning::Fallo la configuracion del webhook via curl"

            
            echo "Esperando 15 segundos para que los servicios inicialicen..."
            sleep 15
            
            # Smoke Test Post-Despliegue
            if curl -fsS --max-time 10 http://localhost:3001/api/check-db > /dev/null 2>&1; then
              echo "✅ Smoke Test Backend: EXITOSO (API respondiendo y BD conectada)"
            else
              echo "::error::❌ Smoke Test Backend: FALLO (El servidor no responde o la BD esta caida)"
              exit 1
            fi

