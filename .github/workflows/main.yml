name: CI/CD DevSecOps

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  quality:
    name: Quality, Audit, Coverage, Build
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SUPABASE_URL: "https://example.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "dummy-key"
      SUPABASE_ANON_KEY: "dummy-key"
      JWT_SECRET: "dummy-secret"
      PORT: 3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend install
        working-directory: backend
        run: npm ci

#      - name: Backend audit
#        working-directory: backend
#        run: npm audit --audit-level=critical
#
#      - name: Backend lint
#        working-directory: backend
#        run: npm run lint
#
#      - name: Backend tests with coverage
#        working-directory: backend
#        run: npm run test:coverage

      - name: Frontend install
        working-directory: frontend
        run: npm ci

#      - name: Frontend audit
#        working-directory: frontend
#        run: npm audit --audit-level=critical
#
#      - name: Frontend lint
#        working-directory: frontend
#        run: npm run lint
#
#      - name: Frontend tests with coverage
#        working-directory: frontend
#        run: npm run test:coverage

      - name: Frontend build
        working-directory: frontend
        run: npm run build

#      - name: SonarQube Cloud scan
#        if: ${{ env.SONAR_TOKEN != '' }}
#        uses: SonarSource/sonarqube-scan-action@v8.2.0
#        env:
#          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
#
#      - name: Upload coverage reports
#        if: always()
#        uses: actions/upload-artifact@v4
#        with:
#          name: coverage-reports
#          path: |
#            backend/coverage
#            frontend/coverage

      - name: Upload frontend build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  zap:
    name: OWASP ZAP Baseline Security
    runs-on: ubuntu-latest
    needs: quality
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start ephemeral stack
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_INVITE_TOKEN_SECRET: ${{ secrets.TELEGRAM_INVITE_TOKEN_SECRET }}
        run: docker compose -f docker-compose.zap.yml up -d --build

      - name: Wait for HTTP targets
        env:
          WAIT_HTTP_TIMEOUT_MS: 600000
        run: |
          npm init -y
          npm install axios
          node scripts/wait-http.js http://127.0.0.1:8080 http://127.0.0.1:3001/

      - name: ZAP frontend baseline
        uses: zaproxy/action-baseline@v0.15.0
        if: always()
        continue-on-error: true
        with:
          target: http://127.0.0.1:8080
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap_frontend

      - name: Preserve ZAP frontend reports
        if: always()
        run: |
          cp report_json.json zap-frontend.json || true
          cp report_html.html zap-frontend.html || true
          cp report_md.md zap-frontend.md || true

      - name: ZAP backend baseline
        uses: zaproxy/action-baseline@v0.15.0
        if: always()
        continue-on-error: true
        with:
          target: http://127.0.0.1:3001
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap_backend

      - name: Preserve ZAP backend reports
        if: always()
        run: |
          cp report_json.json zap-backend.json || true
          cp report_html.html zap-backend.html || true
          cp report_md.md zap-backend.md || true

      - name: Fail on High alerts
        run: node scripts/zap-fail-on-high.js zap-frontend.json zap-backend.json

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            zap-*.html
            zap-*.md
            zap-*.xml
            zap-*.json

      - name: Stop ephemeral stack
        if: always()
        run: docker compose -f docker-compose.zap.yml down --volumes --remove-orphans

  migrate:
    name: Apply DB migrations
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        if: ${{ env.SUPABASE_DB_URL != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations
        if: ${{ env.SUPABASE_DB_URL != '' }}
        working-directory: backend
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Skip notice
        if: ${{ env.SUPABASE_DB_URL == '' }}
        run: echo "::warning::SUPABASE_DB_URL no configurado; se omite la aplicacion de migraciones."

  deploy:
    name: Continuous Deployment (Azure VM)
    runs-on: ubuntu-latest
    needs: [quality, migrate]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Copy Frontend to Azure VM (Apache)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          source: "frontend-dist/*"
          target: "/var/www/html/"
          strip_components: 1

      - name: Deploy Backend & Bot on Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            # Crear directorio base del proyecto si no existe
            if [ ! -d "/home/${{ secrets.AZURE_USER }}/EcenciaAPP" ]; then
              echo "Cloning EcenciaAPP for the first time..."
              git clone https://github.com/Packeins/EcenciaAndinaAPP.git /home/${{ secrets.AZURE_USER }}/EcenciaAPP
            fi
            
            cd /home/${{ secrets.AZURE_USER }}/EcenciaAPP
            
            # Limpiar cambios locales y hacer pull del ultimo main
            git fetch --all
            git reset --hard origin/main
            
            # Restaurar el .env base (CORS, URLs, etc) del despliegue anterior
            if [ -f "/home/${{ secrets.AZURE_USER }}/ECenciaAPP/backend/.env" ]; then
              cp /home/${{ secrets.AZURE_USER }}/ECenciaAPP/backend/.env backend/.env
            else
              touch backend/.env
            fi
            
            # Funcion para inyectar/actualizar secretos de GitHub sin borrar el resto
            set_env() {
              local key=$1
              local val=$2
              if grep -q "^${key}=" backend/.env; then
                # Escapar slashes para sed
                local escaped_val=$(echo "$val" | sed 's/\//\\\//g')
                sed -i "s|^${key}=.*|${key}=${escaped_val}|" backend/.env
              else
                echo "${key}=${val}" >> backend/.env
              fi
            }
            
            set_env "SUPABASE_URL" "${{ secrets.SUPABASE_URL }}"
            set_env "SUPABASE_ANON_KEY" "${{ secrets.SUPABASE_ANON_KEY }}"
            set_env "SUPABASE_SERVICE_ROLE_KEY" "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            set_env "TELEGRAM_BOT_TOKEN" "${{ secrets.TELEGRAM_BOT_TOKEN }}"
            set_env "TELEGRAM_WEBHOOK_SECRET" "${{ secrets.TELEGRAM_WEBHOOK_SECRET }}"
            set_env "TELEGRAM_INVITE_TOKEN_SECRET" "${{ secrets.TELEGRAM_INVITE_TOKEN_SECRET }}"
            set_env "GMAIL_USER" "${{ secrets.GMAIL_USER }}"
            set_env "GMAIL_APP_PASSWORD" "${{ secrets.GMAIL_APP_PASSWORD }}"
            
            # Levantar contenedores actualizados (incluye telegram_bot)
            docker compose build
            docker compose up -d
            
            # Limpiar imagenes huerfanas viejas para liberar espacio
            docker image prune -af
            
            # Smoke Tests Post-Despliegue
            echo "Esperando 10 segundos para que los servicios inicialicen..."
            sleep 10
            if curl -fsS http://localhost:3001/api/check-db >/dev/null; then
              echo "✅ Smoke Test Backend: EXITOSO"
            else
              echo "::error::❌ Smoke Test Backend: FALLO (El servidor no responde o la BD esta caida)"
              exit 1
            fi
