sonar.projectName=Ecencia Andina
sonar.host.url=https://sonarcloud.io
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src,telegram-bot-function/src
sonar.tests=backend/src/test,frontend/src/test,telegram-bot-function/src/test
sonar.test.inclusions=backend/src/**/*.test.js,backend/src/**/*.suite.js,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,telegram-bot-function/src/test/**/*.test.mjs

# Exclusiones para evitar escanear librerias, binarios y reportes
sonar.exclusions=backend/node_modules/**,frontend/node_modules/**,backend/coverage/**,frontend/coverage/**,frontend/dist/**,**/*.sql,**/*.png,**/*.ico
sonar.coverage.exclusions=backend/src/test/**,backend/src/**/*.suite.js,frontend/src/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/components/ui/**,frontend/src/App.tsx,frontend/src/main.tsx,frontend/src/data/mockData.ts,frontend/src/lib/runtimeConfig.ts,backend/src/constants/domain.js,backend/src/config/supabase.js,backend/src/middlewares/internalWebhookSecret.js,backend/src/services/telegramBot.js,frontend/src/hooks/use-mobile.tsx,frontend/src/vite-env.d.ts,telegram-bot-function/src/test/**
sonar.cpd.exclusions=backend/src/test/**,backend/src/**/*.suite.js,frontend/src/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,telegram-bot-function/src/test/**
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info,telegram-bot-function/coverage/lcov.info
